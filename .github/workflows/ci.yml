name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run lint:fsd

      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .cache/browsers
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: chrome-for-testing-${{ runner.os }}-

      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chrome's sandbox needs.
      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test (pac-check, build, e2e)
        run: npm test

      - name: Upload e2e output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e/out
          if-no-files-found: ignore

      - name: Upload extension build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist
          if-no-files-found: error
